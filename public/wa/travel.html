<body>

<header class="mast">
  <nav aria-label="Sections"><a href="finder.html">Whisky Finder</a><a href="stories.html">Stories</a><a href="guides.html">Guides</a><a href="cocktails.html">Cocktails</a><a href="travel.html" aria-current="page">Travel</a><a href="producers.html">Producers</a><a href="industry.html">Industry</a><a href="tools.html">Tools</a></nav>

  <div class="places" id="places"></div>
  <div class="more"><button type="button" class="pill" id="morePlaces" style="display:none">All places</button></div>
</section>

<section class="band" id="list">
  <div class="band-head"><div><span class="mono" id="listKicker">Everywhere</span><h2 class="d2" style="margin-top:10px" id="listTitle"></h2></div><div class="suggest" id="what"><button type="button" data-what="" aria-pressed="true">Everything</button><button type="button" data-what="bars">Bars</button><button type="button" data-what="distillery">Distilleries to visit</button></div></div>
  <div class="picks3" id="picks"></div>

</footer>

<script src="site.js"></script>
<script>
WA.ready(function () {
  WA.stories(function (all) {
    var T = all.filter(function (s) { return s.sec === "travel"; });
    var REGIONS = ["Scotland", "Ireland", "United States", "England & Europe", "Japan & Asia", "Rest of the world", "On the road"];
    var state = { region: "", place: "", what: "", limit: 20, allPlaces: false };
    document.getElementById("regions").innerHTML = '<button type="button" data-region="" aria-pressed="true">Everywhere</button>' + REGIONS.map(function (r) { var n = T.filter(function (s) { return s.region === r; }).length; return n ? '<button type="button" data-region="' + r + '" aria-pressed="false">' + r + " · " + n + "</button>" : ""; }).join("");
    function placesOf() { var P = {}; T.filter(function (s) { return !state.region || s.region === state.region; }).forEach(function (s) { var p = P[s.place] || (P[s.place] = { name: s.place, n: 0, hero: "" }); p.n++; if (!p.hero && s.hero) p.hero = s.hero; }); return Object.keys(P).map(function (k) { return P[k]; }).sort(function (a, b) { return b.n - a.n; }); }
    function board() { var ps = placesOf(), shown = state.allPlaces ? ps : ps.slice(0, 12); document.getElementById("morePlaces").style.display = ps.length > 12 && !state.allPlaces ? "" : "none"; document.getElementById("places").innerHTML = shown.map(function (p, i) { return '<button type="button" class="place" data-place="' + p.name + '" aria-pressed="' + (state.place === p.name) + '">' + (p.hero ? '<img src="' + p.hero + '" alt="" loading="lazy">' : "") + "<strong>" + p.name + "</strong><span>" + p.n + (p.n === 1 ? " story" : " stories") + "</span></button>"; }).join(""); document.querySelectorAll("#regions button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-region") === state.region)); }); }
    function rows() { return T.filter(function (s) { return (!state.region || s.region === state.region) && (!state.place || s.place === state.place) && (!state.what || s[state.what]); }); }
    function list() { var rs = rows(), where = state.place || state.region || "Everywhere"; document.getElementById("listKicker").textContent = where; document.getElementById("listTitle").textContent = rs.length + (rs.length === 1 ? " story" : " stories") + (state.what === "bars" ? " about bars" : state.what === "distillery" ? " about distilleries to visit" : "") + (state.place ? " in " + state.place : state.region ? " across " + state.region : "") + "."; document.getElementById("picks").innerHTML = rs.slice(0, 3).map(function (st) { return '<a class="pick-card" href="' + WA.storyHref(st) + '">' + (st.hero ? '<img src="' + st.hero + '" alt="" loading="lazy">' : "") + '<span class="tag">' + st.place + " · " + WA.when(st.d) + '</span><h3>' + st.title + '</h3><p class="why">' + (st.dek || "") + '</p><p class="by">' + st.by + (st.min ? " · " + st.min + " min" : "") + "</p></a>"; }).join(""); document.getElementById("rows").innerHTML = rs.slice(3, 3 + state.limit).map(WA.storyRow).join(""); document.getElementById("more").style.display = rs.length > 3 + state.limit ? "" : "none"; document.querySelectorAll("#what button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-what") === state.what)); }); document.querySelectorAll(".place").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-place") === state.place)); }); }
    document.getElementById("regions").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; state.region = b.getAttribute("data-region"); state.place = ""; state.limit = 20; state.allPlaces = false; board(); list(); });
    document.getElementById("morePlaces").addEventListener("click", function () { state.allPlaces = true; board(); });
    document.getElementById("places").addEventListener("click", function (e) { var b = e.target.closest(".place"); if (!b) return; var p = b.getAttribute("data-place"); state.place = state.place === p ? "" : p; state.limit = 20; list(); document.getElementById("list").scrollIntoView({ behavior: "smooth", block: "start" }); });
    document.getElementById("what").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; state.what = b.getAttribute("data-what"); state.limit = 20; list(); });
    document.getElementById("more").addEventListener("click", function () { state.limit += 20; list(); });
    board(); list();
  });
});
</script>
</body>
</html>
